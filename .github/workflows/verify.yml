name: Verify payload

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen payload
        run: python tools/verify_payload.py
      - name: Audit license and synthetic fixtures
        run: python tools/audit_release.py
